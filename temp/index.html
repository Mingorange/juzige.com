<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>临时预览 · juzige.com/temp</title>
<style>
  :root{ --ink:#1d1d1f; --sub:#6e6e73; --bg:#f5f5f7; --card:#ffffff; --line:#e5e5e0; --orange:#F79343; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:560px; margin:0 auto; min-height:100dvh; padding:calc(22px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom)); }
  .cap{ font-size:12.5px; letter-spacing:.16em; color:var(--sub); }
  h1{ font-size:32px; font-weight:800; margin-top:8px; }
  .sub{ font-size:14.5px; color:var(--sub); margin-top:8px; line-height:1.6; }
  .list{ margin-top:22px; display:flex; flex-direction:column; gap:12px; }
  a.item{ display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; text-decoration:none; color:var(--ink); }
  a.item:active{ opacity:.75; }
  .item .t{ font-size:18px; font-weight:700; }
  .item .d{ font-size:14px; color:var(--sub); margin-top:5px; line-height:1.55; }
  .item .when{ font-size:12.5px; color:var(--sub); margin-top:8px; }
  .pending{ background:var(--card); border:1px dashed var(--line); border-radius:16px; padding:16px 18px; }
  .pending .t{ font-size:18px; font-weight:700; }
  .pending .d{ font-size:14px; color:var(--sub); margin-top:5px; line-height:1.55; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:99px; background:var(--orange); margin-right:7px; vertical-align:2px; }
  .foot{ font-size:12.5px; color:var(--sub); margin-top:26px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">TEMP · 临时预览</div>
  <h1>等你看的东西，都在这儿</h1>
  <div class="sub">你在外面的时候，小橘子做好的样本、试听、待审稿都放这一页，打开就能看、能听、能批。</div>

  <div class="list">
    <div class="pending">
      <div class="t"><span class="dot"></span>橘子电台新一期 · 制作中</div>
      <div class="d">素材是 picklecat 在 X 发的那条。抓到原文就写稿合成，做好直接放这一页试听，你点头才发布。</div>
    </div>

    <a class="item" href="https://juzige.com/train-video/">
      <div class="t">深蹲 · 视频版样本</div>
      <div class="d">你库里的原视频，按 App 单动作页排的，绿色按钮能真打卡。</div>
      <div class="when">2026-11-19</div>
    </a>

    <a class="item" href="https://juzige.com/train-3d/">
      <div class="t">深蹲 · 3D 版样本</div>
      <div class="d">OpenGym3D 的真人比例模型加动捕，能拖动转角度。</div>
      <div class="when">2026-11-19</div>
    </a>
  </div>

  <div class="foot">这一页不进主页导航，知道链接才能打开。</div>
</div>
</body>
</html>
