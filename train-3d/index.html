<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>杠铃深蹲 · OpenGym3D 样本</title>
<style>
  :root{ --ink:#1d1d1f; --sub:#6e6e73; --cream:#f7f3ec; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif; background:var(--cream); color:var(--ink); }
  .wrap{ max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:calc(16px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom)); }
  .cap{ font-size:13px; letter-spacing:.14em; color:var(--sub); }
  h1{ font-size:44px; font-weight:800; margin-top:8px; }
  .sub{ font-size:15px; color:var(--sub); margin-top:6px; }
  #stage{ flex:1; position:relative; margin-top:6px; min-height:320px; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  .badge{ position:absolute; left:0; bottom:8px; font-size:12.5px; color:var(--sub); background:rgba(255,255,255,.65); padding:5px 10px; border-radius:999px; }
  .loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:15px; }
  .foot{ font-size:13.5px; color:var(--sub); line-height:1.7; margin-top:10px; }
  .foot b{ color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">OPENGYM3D 样本 · 开源 MIT</div>
  <h1>杠铃深蹲</h1>
  <div class="sub">真人比例 3D 模型 + 动捕动画 · 无缝循环 · 拖动可以转角度</div>
  <div id="stage"><div class="loading" id="loading">加载中…</div><div class="badge">股四头肌 / 臀大肌 / 竖脊肌</div></div>
  <div class="foot">素材来自开源库 <b>OpenGym3D</b>（MIT 授权，可商用）：模型 + 杠铃 + 整套深蹲动捕都在这一个 GLB 里，<b>6.0MB</b> 是未压缩的原样，正式上架前可以压到几百 KB。动作对不对、人物够不够精致，你说了算。</div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0xf7f3ec);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
camera.position.set(2.3, 1.5, 3.1);
camera.lookAt(0, 0.85, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc4b2, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(3, 6, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -2; key.shadow.camera.right = 2;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -1;
scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.5);
rim.position.set(-3, 2, -2.5);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(2.4, 48), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const holder = new THREE.Group();
scene.add(holder);

let mixer = null;
const clock = new THREE.Clock();

new GLTFLoader().load('assets/back_squat.glb', (gltf) => {
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
  const box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x;
  model.position.z -= c.z;
  model.position.y -= box.min.y;
  holder.add(model);
  mixer = new THREE.AnimationMixer(model);
  for (const clip of gltf.animations) {
    const a = mixer.clipAction(clip);
    a.setLoop(THREE.LoopRepeat);
    a.play();
  }
  document.getElementById('loading').style.display = 'none';
}, undefined, (err) => {
  document.getElementById('loading').textContent = '加载失败，刷新试试';
  console.error(err);
});

let dragOff = 0, dragging = false, lastX = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  dragOff += (e.clientX - lastX) * 0.008;
  lastX = e.clientX;
});
window.addEventListener('pointerup', () => dragging = false);

let lastW = 0, lastH = 0;
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w === lastW && h === lastH) return;
  lastW = w; lastH = h;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}

function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  if (mixer) mixer.update(dt);
  if (!dragging) dragOff += 0.0016;
  holder.rotation.y = -0.5 + Math.sin(t*0.22)*0.35 + dragOff;
  resize();
  renderer.render(scene, camera);
}
resize();
tick();
</script>
</body>
</html>
