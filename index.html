<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>juzige.com</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='56' r='38' fill='%23E8862E'/%3E%3Cpath d='M52 20 C58 6, 74 4, 82 8 C80 20, 68 26, 54 24 Z' fill='%237A8B6F'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f5f7;
    --ink:#1d1d1f;
    --grey:#6e6e73;
    --line:#d2d2d7;
    --orange:#E8862E;
    --sage:#7A8B6F;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- 左上角固定导航标识 ---------- */
  .site-nav{
    position:fixed;top:22px;left:26px;z-index:10;
    display:flex;align-items:center;gap:9px;
    font-weight:600;
    color:#1d1d1f;text-decoration:none;cursor:pointer;
    transition:opacity .25s ease;
  }
  .site-nav:hover{opacity:.65;}
  .site-nav svg{width:22px;height:22px;display:block;flex:none;}
  .site-nav .name{font-size:14px;letter-spacing:.3em;}

  /* ---------- 通用屏 ---------- */
  .screen{
    position:relative;
    min-height:100vh;min-height:100svh;
    display:flex;align-items:center;
    border-bottom:1px solid var(--line);
    padding:96px 6vw;
  }
  .screen:last-child{border-bottom:none;}
  .wrap{width:100%;max-width:880px;margin:0 auto;}
  .sno{
    position:absolute;left:26px;bottom:20px;
    font-size:11px;letter-spacing:.18em;color:#aeaeb2;
  }
  h1{
    font-size:clamp(34px,6.4vw,60px);
    font-weight:700;line-height:1.22;letter-spacing:-.01em;
  }
  .sub{
    margin-top:26px;
    font-size:clamp(15px,2vw,19px);
    color:var(--grey);line-height:1.6;
  }

  /* ---------- 索引行（屏2/3/4） ---------- */
  .rows{margin-top:52px;border-top:1px solid var(--line);}
  .row{
    display:flex;align-items:baseline;justify-content:space-between;gap:24px;
    padding:22px 2px;
    border-bottom:1px solid var(--line);
    font-size:clamp(19px,3vw,28px);
    font-weight:600;line-height:1.45;
  }
  .row .city{
    flex:none;
    font-size:clamp(13px,1.7vw,16px);
    font-weight:400;color:var(--grey);letter-spacing:.08em;
  }

  /* ---------- 屏5 · 关于我 ---------- */
  .facts{margin-top:44px;}
  .facts p{
    font-size:clamp(16px,2.2vw,21px);
    line-height:2.15;color:var(--ink);font-weight:400;
  }

  /* ---------- 屏6 · 联系 ---------- */
  .screen-contact{
    flex-direction:column;justify-content:center;text-align:center;
    padding:96px 6vw 72px;
  }
  .contact-logo{
    width:min(20vw,30vh);min-width:120px;height:auto;display:block;margin:0 auto;
  }
  .contact-name{
    margin-top:min(4.5vh,6vw);
    font-size:clamp(20px,3.4vw,42px);
    font-weight:600;letter-spacing:.35em;text-indent:.35em;line-height:1.2;white-space:nowrap;
  }
  .qr{
    margin:min(5vh,7vw) auto 0;
    width:min(180px,44vw);aspect-ratio:1/1;
    border:1px solid var(--line);
    background:#ececf0;
    display:flex;align-items:center;justify-content:center;
  }
  .qr span{font-size:14px;color:var(--grey);letter-spacing:.3em;text-indent:.3em;}
  .domain{
    position:absolute;left:0;right:0;bottom:20px;
    text-align:center;
    font-size:11px;letter-spacing:.22em;color:#aeaeb2;
  }
  a.row{color:inherit;text-decoration:none;cursor:pointer}
</style>
</head>
<body>

  <!-- 左上角固定导航标识：点击回主页（Logo 页） -->
  <a class="site-nav" href="#" aria-label="回主页">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="56" r="38" fill="#E8862E"/>
      <path d="M52 20 C58 6, 74 4, 82 8 C80 20, 68 26, 54 24 Z" fill="#7A8B6F"/>
    </svg>
    <span class="name">看橘子哥</span>
  </a>

  <!-- 屏1 · 定位 -->
  <section class="screen">
    <div class="wrap">
      <h1>我先转了 AI。<br>现在，帮你转。</h1>
      <p class="sub">1.0 靠设计吃饭，2.0 全面转向 AI，帮老板把 AI 用进生意里。</p>
    </div>
    <span class="sno">S1</span>
  </section>

  <!-- 屏2 · 我做的事 -->
  <section class="screen">
    <div class="wrap">
      <h1>只做三件事。</h1>
      <div class="rows">
        <div class="row"><span>搭 AI 环境</span></div>
        <div class="row"><span>陪跑用起来</span></div>
        <div class="row"><span>走访分享</span></div>
      </div>
    </div>
    <span class="sno">S2</span>
  </section>

  <!-- 屏3 · 走访手记 -->
  <section class="screen">
    <div class="wrap">
      <h1>走访手记。</h1>
      <div class="rows">
        <a class="row" href="https://mp.weixin.qq.com/s/d3DbbO795mcWgBGP0fs0bw" target="_blank" rel="noopener"><span>AI 影视</span><span class="city">杭州</span></a>
        <div class="row"><span>AI 编程与工厂</span><span class="city">温州</span></div>
        <div class="row"><span>数字医学</span><span class="city">上海</span></div>
      </div>
    </div>
    <span class="sno">S3</span>
  </section>

  <!-- 屏4 · 作品 -->
  <section class="screen">
    <div class="wrap">
      <h1>作品。</h1>
      <div class="rows">
        <div class="row"><span>互动知识馆 — 把中考知识点做成能动手玩的图解</span></div>
        <div class="row"><span>公众号 — 看橘子哥</span></div>
      </div>
    </div>
    <span class="sno">S4</span>
  </section>

  <!-- 屏5 · 关于我 -->
  <section class="screen">
    <div class="wrap">
      <h1>关于我。</h1>
      <div class="facts">
        <p>设计公司老板出身</p>
        <p>在加拿大生活了 5 年，2026 年回国</p>
        <p>44 岁，全面转向 AI</p>
        <p>投资是存量，AI 是增量</p>
      </div>
    </div>
    <span class="sno">S5</span>
  </section>

  <!-- 屏6 · 联系 -->
  <section class="screen screen-contact">
    <svg class="contact-logo" viewBox="0 0 100 100" role="img" aria-label="看橘子哥 Logo">
      <circle cx="50" cy="56" r="38" fill="#E8862E"/>
      <path d="M52 20 C58 6, 74 4, 82 8 C80 20, 68 26, 54 24 Z" fill="#7A8B6F"/>
    </svg>
    <div class="contact-name">看橘子哥</div>
    <div class="qr"><span>二维码</span></div>
    <span class="sno">S6</span>
    <div class="domain">juzige.com</div>
  </section>

</body>
</html>
